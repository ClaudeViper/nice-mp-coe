services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nice-mp-coe:latest
    container_name: nice-mp-coe
    ports:
      - "3000:3000"

    # Load secrets from a .env file on the host — NEVER commit .env
    env_file:
      - .env

    volumes:
      # Persist generated audio files between container restarts
      - audio_samples:/home/nextjs/audio_samples

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  audio_samples:
    driver: local
